version: 1
frontend:
  phases:
    preBuild:
      commands:
        # Next 16 and sharp both declare engines >=20.9.0. Amplify's default
        # build image can still be on Node 18, where `next build` aborts
        # immediately. Select an explicit version rather than inherit one.
        - nvm install 20
        - nvm use 20
        # Echoed so the build log states the version outright if this recurs.
        - node -v && npm -v
        # `npm ci` needs the lockfile; it is committed.
        - npm ci
    build:
      commands:
        # `prebuild` regenerates src/data/manifest.generated.ts from whatever is
        # actually in public/, so dropping in a new frame sequence or video and
        # pushing is enough — no code change (BUILD_BRIEF §11).
        - npm run build
  artifacts:
    # Server-rendered build (platform WEB_COMPUTE). Amplify reads .next and
    # provisions the Next.js runtime itself, so no baseDirectory is set.
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*

customHeaders:
  # Frame sequences, video and posters are addressed by name and never change in
  # place — a new sequence is a new set of files. Safe to cache hard.
  - pattern: '/frames/**'
    headers:
      - key: Cache-Control
        value: 'public, max-age=31536000, immutable'
  - pattern: '/video/**'
    headers:
      - key: Cache-Control
        value: 'public, max-age=31536000, immutable'
  - pattern: '/posters/**'
    headers:
      - key: Cache-Control
        value: 'public, max-age=31536000, immutable'
  - pattern: '/_next/static/**'
    headers:
      - key: Cache-Control
        value: 'public, max-age=31536000, immutable'
  # Baseline security headers. No external origins are used anywhere on the
  # site — all CSS, JS, fonts, images and video are same-origin — so the policy
  # can stay tight.
  - pattern: '**'
    headers:
      - key: X-Content-Type-Options
        value: 'nosniff'
      - key: X-Frame-Options
        value: 'SAMEORIGIN'
      - key: Referrer-Policy
        value: 'strict-origin-when-cross-origin'
      - key: Permissions-Policy
        value: 'camera=(), microphone=(), geolocation=(), interest-cohort=()'
      - key: Strict-Transport-Security
        value: 'max-age=63072000; includeSubDomains'
